apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - serviceaccount.yaml
  - role.yaml
  - rolebinding.yaml
  - cronjob.yaml
  - networkpolicy.yaml

configMapGenerator:
  - name: informer-config
    literals:
      # Valeurs à remplacer dans l'overlay (behavior: merge).
      - REPORT_URL=https://inventory.example.com/api/images
      - HTTP_TIMEOUT=30s
      # TARGET_NAMESPACE absent : le namespace du CronJob est listé.

# Jamais `commonLabels`, ni `labels` avec includeSelectors : true. Kustomize
# injecterait le label dans TOUS les sélecteurs, y compris le podSelector de la
# règle DNS qui vise kube-system, et cette règle ne correspondrait plus à rien
# — sans aucune erreur.
labels:
  - pairs:
      app.kubernetes.io/name: informer
    includeSelectors: false
